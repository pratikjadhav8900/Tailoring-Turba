<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 240" width="100" height="240">
  <!-- 
    Master Brand Icon - Tailoring Turba
    High-Resolution Master Geometry
    Color: Navy Blue (#003145)
  -->
  <g transform="translate(10, 10)">
    <!-- Main Needle Column -->
    <path fill="#003145" d="M 37.5 5 L 42.5 5 L 42.5 200 L 40 225 L 37.5 200 Z" />
    
    <!-- Needle Eye -->
    <rect x="39" y="14" width="2" height="18" rx="1" fill="white" />
    
    <!-- Stylized "T" Cross-Wings -->
    <path fill="#003145" d="M 5 45 
      C 15 35, 25 32, 40 38 
      C 55 32, 65 35, 75 45 
      L 75 65 
      C 60 55, 50 52, 40 55 
      C 30 52, 20 55, 5 65 Z" />
    
    <!-- The Button -->
    <circle cx="40" cy="115" r="22" fill="#003145" />
    <circle cx="40" cy="115" r="19" fill="none" stroke="white" stroke-width="0.75" opacity="0.4" />
    
    <!-- Symmetrical 4-Hole Pattern -->
    <circle cx="34" cy="109" r="2.8" fill="white" />
    <circle cx="46" cy="109" r="2.8" fill="white" />
    <circle cx="34" cy="121" r="2.8" fill="white" />
    <circle cx="46" cy="121" r="2.8" fill="white" />
    
    <!-- Bottom Tail Flare -->
    <path fill="#003145" d="M 18 175 
      C 25 170, 35 170, 40 178 
      C 45 170, 55 170, 62 175 
      L 62 185 
      L 40 195 
      L 18 185 Z" />
  </g>
</svg>
