<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="100%" height="100%">
  <defs>
    <style>
      .brand-color { fill: #004b6b; }
    </style>
  </defs>

  <g transform="translate(0, 5)">
    <!-- Vertical Needle -->
    <path class="brand-color" d="M 38 10 L 42 10 L 42 70 L 40 90 L 38 70 Z" />
    <!-- Needle eye hole -->
    <rect x="39" y="15" width="2" height="10" fill="#ffffff" />
    
    <!-- Horizontal Cross Piece (Stylized wings/fabric) -->
    <path class="brand-color" d="M 10 40 Q 25 35 40 40 Q 55 35 70 40 L 70 45 L 10 45 Z" />
    
    <!-- The bottom horizontal stroke -->
    <path class="brand-color" d="M 25 75 L 55 75 L 55 78 L 25 78 Z" />
    
    <!-- Button in the center -->
    <circle cx="40" cy="55" r="12" class="brand-color" />
    <!-- 4 button holes -->
    <circle cx="36" cy="51" r="1.5" fill="#ffffff" />
    <circle cx="44" cy="51" r="1.5" fill="#ffffff" />
    <circle cx="36" cy="59" r="1.5" fill="#ffffff" />
    <circle cx="44" cy="59" r="1.5" fill="#ffffff" />
  </g>
</svg>
