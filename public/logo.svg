<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <!-- 
    Master Brand Asset - Tailoring Turba
    Synthesis: High-Resolution Pixel-Perfect Vector
    Color: Navy Blue (#003145)
  -->

  <defs>
    <style>
      .logo-fill { fill: #003145; }
      .brand-typography {
        font-family: 'Times New Roman', Times, serif;
        font-weight: 600;
        fill: #003145;
        text-anchor: start;
      }
      .text-primary { font-size: 44px; letter-spacing: 22px; }
      .text-secondary { font-size: 44px; letter-spacing: 24px; }
    </style>
  </defs>

  <!-- High-Precision Logo Mark -->
  <g transform="translate(80, 40)">
    <!-- Main Needle Column -->
    <path class="logo-fill" d="M 37.5 5 L 42.5 5 L 42.5 200 L 40 225 L 37.5 200 Z" />
    
    <!-- Needle Eye -->
    <rect x="39" y="14" width="2" height="18" rx="1" fill="white" />
    
    <!-- Stylized "T" Cross-Wings (Precise Geometry from Source) -->
    <path class="logo-fill" d="M 5 45 
      C 15 35, 25 32, 40 38 
      C 55 32, 65 35, 75 45 
      L 75 65 
      C 60 55, 50 52, 40 55 
      C 30 52, 20 55, 5 65 Z" />
    
    <!-- The Button (Perfect Symmetry, High Definition) -->
    <!-- Outer Rim -->
    <circle cx="40" cy="115" r="22" class="logo-fill" />
    <!-- Inner Rim Detail -->
    <circle cx="40" cy="115" r="19" fill="none" stroke="white" stroke-width="0.75" opacity="0.4" />
    
    <!-- Symmetrical 4-Hole Pattern -->
    <circle cx="34" cy="109" r="2.8" fill="white" />
    <circle cx="46" cy="109" r="2.8" fill="white" />
    <circle cx="34" cy="121" r="2.8" fill="white" />
    <circle cx="46" cy="121" r="2.8" fill="white" />
    
    <!-- Bottom Tail Flare (Sharp & Symmetrical) -->
    <path class="logo-fill" d="M 18 175 
      C 25 170, 35 170, 40 178 
      C 45 170, 55 170, 62 175 
      L 62 185 
      L 40 195 
      L 18 185 Z" />
  </g>

  <!-- Typography Cluster (Vertical Alignment Synthesis) -->
  <g transform="translate(260, 115)">
    <!-- TAILORING (Line 1) -->
    <text x="0" y="0" class="brand-typography text-primary">TAILORING</text>
    <!-- TURBA (Line 2 - Centered Alignment relative to Line 1) -->
    <!-- Offset calculation for centered 'TURBA' under 'TAILORING' -->
    <text x="110" y="70" class="brand-typography text-secondary">TURBA</text>
  </g>
</svg>
